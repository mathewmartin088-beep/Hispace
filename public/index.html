  <div id="titlebar">
    <div class="tb-brand"><img src="icon.png" alt="" width="16" height="16"><span>Hispace</span></div>
  </div>

  <!-- Connect + sign-in -->
  <main id="gate" class="hidden">
    <section class="hero">
      <div class="wave" id="wave" aria-hidden="true"></div>
      <h1 class="wordmark">hispace</h1>
      <p class="tagline">Text and voice for your people. Your server, your data, no tracking.</p>
    </section>

    <section class="gate-card" id="connect-card">
      <h2>Connect to Hispace</h2>
      <form id="join-form">
        <label for="join-addr">Server address</label>
        <input id="join-addr" type="text" placeholder="chat.example.com" autocomplete="off" spellcheck="false">
        <p class="hint">This is the address of the Hispace server your friends use. You only enter it once.</p>
        <p class="form-error" id="join-error" role="alert"></p>
        <button class="btn primary wide" type="submit">Connect</button>
      </form>
    </section>

    <section class="gate-card hidden" id="auth-card">
      <h2 id="auth-title">Welcome back</h2>
      <div class="seg" role="tablist">
        <button type="button" class="on" data-tab="login">Sign in</button>
        <button type="button" data-tab="register">Create account</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label for="auth-user">Username</label>
        <input id="auth-user" name="username" type="text" autocomplete="username" maxlength="20" spellcheck="false">
        <label for="auth-pass">Password</label>
        <input id="auth-pass" name="password" type="password" autocomplete="current-password" maxlength="100">
        <div id="confirm-row" class="hidden">
          <label for="auth-pass2">Repeat password</label>
          <input id="auth-pass2" type="password" autocomplete="new-password" maxlength="100">
        </div>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn primary wide" type="submit" id="auth-btn">Sign in</button>
      </form>
      <p class="server-line">Server <code id="auth-server"></code> <button type="button" class="link" id="auth-change">Change</button></p>
    </section>
  </main>

  <!-- App -->
  <div id="app" class="hidden">
    <nav id="rail" aria-label="Servers">
      <button class="rail-btn home" id="rail-home" title="Direct messages" aria-label="Direct messages"><svg class="icon"><use href="#i-message"/></svg></button>
      <div class="rail-sep"></div>
      <div id="server-list"></div>
      <button class="rail-btn add" id="rail-add" title="Create or join a server" aria-label="Create or join a server"><svg class="icon"><use href="#i-plus"/></svg></button>
    </nav>

    <aside id="sidebar">
      <header id="sb-head"></header>
      <div id="sb-scroll"></div>
      <div id="voice-bar" class="hidden"></div>
      <div id="userbar"></div>
    </aside>

    <section id="main">
      <header id="chat-head"></header>
      <div id="call-strip" class="hidden"></div>
      <div id="conn-banner" class="hidden" role="status"></div>
      <div id="messages" tabindex="0"></div>
      <button id="jump" class="hidden"><svg class="icon"><use href="#i-arrow-down"/></svg><span>New messages</span></button>
      <div id="typing" aria-live="polite"></div>
      <div id="composer"></div>
    </section>

    <aside id="members"></aside>
    <div id="scrim" class="hidden"></div>
  </div>

  <div id="audio-sink" hidden></div>
  <div id="layers"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="js/socket.io.min.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/state.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
